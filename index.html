<!DOCTYPE html>
<html lang="uk">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>AgroGrant Assistant</title>
	<!-- Підключення бібліотеки для графіків -->
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<link rel="icon"
		href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=">
	<style>
		body {
			font-family: 'Segoe UI', Tahoma, sans-serif;
			text-align: center;
			margin: 0;
			padding: 20px;
			background-color: #f4f7f6;
		}

		.container {
			max-width: 650px;
			margin: 0 auto;
		}

		#chatbox {
			width: 100%;
			height: 350px;
			background: white;
			border-radius: 10px;
			box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
			margin: 15px 0;
			overflow-y: auto;
			padding: 15px;
			text-align: left;
			display: flex;
			flex-direction: column;
			gap: 10px;
			box-sizing: border-box;
		}

		.msg {
			padding: 10px 15px;
			border-radius: 15px;
			max-width: 80%;
			word-wrap: break-word;
		}

		.user {
			background-color: #d1e7dd;
			align-self: flex-end;
			color: #0f5132;
		}

		.bot {
			background-color: #e2e3e5;
			align-self: flex-start;
			color: #41464c;
		}

		.error {
			background-color: #f8d7da;
			align-self: center;
			color: #842029;
			font-size: 13px;
		}

		.controls {
			display: flex;
			gap: 8px;
			justify-content: center;
			margin-bottom: 12px;
		}

		#textInput {
			flex: 1;
			padding: 12px;
			border-radius: 25px;
			border: 1px solid #ccc;
			font-size: 15px;
			outline: none;
		}

		.btn {
			padding: 12px 22px;
			font-size: 16px;
			cursor: pointer;
			border-radius: 25px;
			color: white;
			border: none;
			transition: 0.2s;
			white-space: nowrap;
		}

		.btn:disabled {
			opacity: 0.65;
			cursor: wait;
		}

		#sendBtn {
			background-color: #0d6efd;
		}

		#micBtn {
			background-color: #198754;
		}

		#downloadBtn {
			background-color: #6f42c1;
			margin-top: 10px;
			width: 100%;
		}

		#resetBtn {
			background-color: #6c757d;
			margin-top: 8px;
			width: 100%;
		}

		#micBtn.recording {
			background-color: #dc3545;
			animation: pulse 1.5s infinite;
		}

		@keyframes pulse {
			0% {
				transform: scale(1);
			}

			50% {
				transform: scale(1.04);
			}

			100% {
				transform: scale(1);
			}
		}

		#profileBox {
			background: white;
			padding: 12px 15px;
			border-radius: 10px;
			text-align: left;
			font-size: 14px;
			box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
			margin-top: 10px;
			line-height: 1.6;
		}

		#profileBox span {
			font-weight: 600;
			color: #198754;
		}

		/* Стилі для блоку грантів та графіка */
		#grantsBox {
			background: white;
			padding: 12px 15px;
			border-radius: 10px;
			text-align: left;
			font-size: 14px;
			box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
			margin-top: 10px;
			display: none;
		}

		.grant-item {
			border-bottom: 1px solid #eee;
			padding-bottom: 10px;
			margin-bottom: 10px;
		}

		.grant-item:last-child {
			border-bottom: none;
			padding-bottom: 0;
			margin-bottom: 0;
		}

		.grant-score {
			font-weight: bold;
			font-size: 15px;
			float: right;
		}

		.grant-title {
			font-weight: 600;
			color: #333;
			margin-bottom: 4px;
			padding-right: 50px;
		}

		.grant-details {
			font-size: 13px;
			color: #666;
		}

		#chartContainer {
			width: 250px;
			height: 250px;
			margin: 20px auto 0 auto;
		}
	</style>
</head>

<body>
	<div class="container">
		<h1>🎙️ AgroGrant Assistant</h1>
		<p>Назвіть код ЄДРПОУ (наприклад, 03728915) або розкажіть про своє підприємство</p>

		<div id="chatbox"></div>

		<div class="controls">
			<input type="text" id="textInput" placeholder="Говоріть у мікрофон або введіть текст / ЄДРПОУ..." />
			<button id="sendBtn" class="btn">Надіслати</button>
			<button id="micBtn" class="btn">Голос</button>
		</div>

		<div id="profileBox">
			<strong>Зібрані дані підприємства:</strong><br>
			ЄДРПОУ: <span id="p_edrpou">—</span> | Назва: <span id="p_company">—</span> | КВЕД: <span
				id="p_kved">—</span><br>
			Регіон: <span id="p_region">—</span> | Діяльність: <span id="p_activity">—</span> | Розмір: <span
				id="p_size">—</span><br>
			Працівники: <span id="p_emp">—</span> | Інвестиції: <span id="p_focus">—</span> | Внесок: <span
				id="p_own">—</span>
		</div>

		<div id="grantsBox">
			<strong>Сумісність із грантовими програмами:</strong>
			<div id="grantsList" style="margin-top: 10px;"></div>
			<div id="chartContainer"><canvas id="financeChart"></canvas></div>
		</div>

		<button id="downloadBtn" class="btn">Завантажити звіт та заявку (Word)</button>
		<button id="resetBtn" class="btn">Почати нову заявку (скинути сесію)</button>
	</div>

	<script>
		document.addEventListener("DOMContentLoaded", () => {
			const BACKEND_URL = "https://" + "agrogrant.onrender.com";
			fetch(`${BACKEND_URL}/`).catch(() => { });

			function uuidv4() {
				return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
					const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
					return v.toString(16);
				});
			}

			let userId = localStorage.getItem('agrogrant_user_id');
			if (!userId) {
				userId = uuidv4();
				localStorage.setItem('agrogrant_user_id', userId);
			}

			const chatbox = document.getElementById('chatbox');
			const textInput = document.getElementById('textInput');
			const sendBtn = document.getElementById('sendBtn');
			const micBtn = document.getElementById('micBtn');
			const downloadBtn = document.getElementById('downloadBtn');
			const resetBtn = document.getElementById('resetBtn');

			let isRecording = false;
			let isSending = false;
			let finalTranscript = '';
			let silenceTimer = null;
			let finChart = null;
			const SILENCE_DELAY = 3500;

			function addMessage(sender, text, isError = false) {
				if (!chatbox) return;
				const div = document.createElement('div');
				div.className = 'msg ' + (isError ? 'error' : (sender === 'Ви' ? 'user' : 'bot'));
				div.innerHTML = `<strong>${sender}:</strong><br>${text}`;
				chatbox.appendChild(div);
				chatbox.scrollTop = chatbox.scrollHeight;
			}

			function updateProfileUI(p) {
				const map = {
					'p_edrpou': p && p.edrpou,
					'p_company': p && p.company_name,
					'p_kved': p && p.kved,
					'p_region': p && p.region,
					'p_activity': p && p.activity_type,
					'p_size': p && p.size_category,
					'p_emp': p && p.employees_count,
					'p_focus': p && p.investment_focus,
					'p_own': p && p.own_contribution_percent
				};
				for (const [id, val] of Object.entries(map)) {
					const el = document.getElementById(id);
					if (el) el.textContent = val || '—';
				}
			}

			// Захищена функція оновлення списку та графіка
			function updateGrantsUI(grants, p) {
				const box = document.getElementById('grantsBox');
				const list = document.getElementById('grantsList');
				if (!box || !list) return;

				// Якщо грантів немає - ховаємо блок і видаляємо старий графік
				if (!grants || grants.length === 0) {
					box.style.display = 'none';
					if (finChart) { finChart.destroy(); finChart = null; }
					return;
				}

				box.style.display = 'block';
				list.innerHTML = '';

				grants.forEach(g => {
					const div = document.createElement('div');
					div.className = 'grant-item';

					let scoreColor = '#198754';
					if (g.score < 75) scoreColor = '#fd7e14';
					if (g.score < 40) scoreColor = '#dc3545';

					div.innerHTML = `
                        <div class="grant-score" style="color: ${scoreColor}">${g.score}%</div>
                        <div class="grant-title">${g.title}</div>
                        <div class="grant-details">Макс. сума: ${g.max_amount} | ${g.reason}</div>
                    `;
					list.appendChild(div);
				});

				// Безпечне малювання графіка для першого гранту
				const topGrant = grants[0];
				let ownPct = p && p.own_contribution_percent ? parseFloat(String(p.own_contribution_percent).replace(/[^\d.]/g, '')) : topGrant.min_own_percent;
				ownPct = Math.max(ownPct || 0, topGrant.min_own_percent);
				let grantPct = 100 - ownPct;

				if (finChart) { finChart.destroy(); }
				const ctx = document.getElementById('financeChart');
				if (ctx) {
					finChart = new Chart(ctx, {
						type: 'doughnut',
						data: {
							labels: ['Грант (%)', 'Власний внесок (%)'],
							datasets: [{ data: [grantPct, ownPct], backgroundColor: ['#0d6efd', '#198754'] }]
						},
						options: { plugins: { title: { display: true, text: 'Пропорція фінансування (найкращий грант)' } } }
					});
				}
			}

			async function sendMessage(text) {
				const cleanText = text.trim();
				if (!cleanText || isSending) return;

				isSending = true;
				addMessage('Ви', cleanText);
				if (textInput) textInput.value = '';
				finalTranscript = '';

				try {
					const response = await fetch(`${BACKEND_URL}/chat/${userId}`, {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({ message: cleanText })
					});

					if (!response.ok) {
						throw new Error(`Помилка сервера: ${response.status}`);
					}

					const data = await response.json();
					addMessage('AgroGrant', data.reply, data.is_error);
					updateProfileUI(data.profile);
					updateGrantsUI(data.grants, data.profile);

					if (!data.is_error && window.speechSynthesis) {
						window.speechSynthesis.cancel();
						const utterance = new SpeechSynthesisUtterance(data.reply);
						utterance.lang = 'uk-UA';
						window.speechSynthesis.speak(utterance);
					}
				} catch (error) {
					console.error('Fetch error:', error);
					addMessage('Помилка', 'Не вдалося з\'єднатися із сервером.', true);
				} finally {
					isSending = false;
				}
			}

			if (downloadBtn) {
				downloadBtn.addEventListener('click', async () => {
					const origText = downloadBtn.textContent;
					downloadBtn.disabled = true;
					downloadBtn.textContent = 'Формую звіт...';

					try {
						let resp = await fetch(`${BACKEND_URL}/export/${userId}`);
						if (resp.status === 503) {
							await new Promise(r => setTimeout(r, 4000));
							resp = await fetch(`${BACKEND_URL}/export/${userId}`);
						}
						if (!resp.ok) throw new Error(`Помилка ${resp.status}`);

						const blob = await resp.blob();
						const url = window.URL.createObjectURL(blob);
						const a = document.createElement('a');
						a.href = url;
						a.download = 'AgroGrant_Analytical_Report.docx';
						document.body.appendChild(a);
						a.click();
						a.remove();
						window.URL.revokeObjectURL(url);
					} catch (err) {
						addMessage('Помилка', 'Не вдалося завантажити файл.', true);
					} finally {
						downloadBtn.disabled = false;
						downloadBtn.textContent = origText;
					}
				});
			}

			if (resetBtn) {
				resetBtn.addEventListener('click', () => {
					if (confirm("Почати нову заявку?")) {
						localStorage.removeItem('agrogrant_user_id');
						userId = uuidv4();
						localStorage.setItem('agrogrant_user_id', userId);
						if (chatbox) chatbox.innerHTML = '';
						updateProfileUI(null);
						updateGrantsUI(null, null);
						addMessage('Система', 'Сесію скинуто. Введіть новий код ЄДРПОУ або розкажіть про підприємство.');
					}
				});
			}

			const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
			if (!SpeechRecognition) {
				if (micBtn) { micBtn.disabled = true; micBtn.textContent = 'Мікрофон недоступний'; }
				if (sendBtn) sendBtn.addEventListener('click', () => { if (textInput) sendMessage(textInput.value); });
				if (textInput) textInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(textInput.value); });
			} else {
				const recognition = new SpeechRecognition();
				recognition.lang = 'uk-UA';
				recognition.continuous = true;
				recognition.interimResults = true;

				function stopRecordingAndSend() {
					clearTimeout(silenceTimer);
					if (isRecording) {
						isRecording = false;
						try { recognition.stop(); } catch (e) { }
					}
					if (micBtn) {
						micBtn.textContent = 'Голос';
						micBtn.classList.remove('recording');
					}
					const textToSend = textInput ? textInput.value : '';
					if (textToSend.trim() && !isSending) sendMessage(textToSend);
				}

				if (micBtn) {
					micBtn.addEventListener('click', () => {
						if (isRecording) stopRecordingAndSend();
						else {
							if (window.speechSynthesis) window.speechSynthesis.cancel();
							finalTranscript = (textInput && textInput.value) ? textInput.value + ' ' : '';
							isRecording = true;
							try { recognition.start(); } catch (e) { }
							micBtn.textContent = 'Готово';
							micBtn.classList.add('recording');
						}
					});
				}

				if (sendBtn) {
					sendBtn.addEventListener('click', () => {
						if (isRecording) stopRecordingAndSend();
						else if (textInput) sendMessage(textInput.value);
					});
				}

				if (textInput) {
					textInput.addEventListener('keydown', (e) => {
						if (e.key === 'Enter') {
							if (isRecording) stopRecordingAndSend();
							else sendMessage(textInput.value);
						}
					});
				}

				recognition.onresult = (event) => {
					clearTimeout(silenceTimer);
					let interimTranscript = '';
					for (let i = event.resultIndex; i < event.results.length; ++i) {
						if (event.results[i].isFinal) finalTranscript += event.results[i][0].transcript + ' ';
						else interimTranscript += event.results[i][0].transcript;
					}
					if (textInput) textInput.value = (finalTranscript + interimTranscript).trim();
					silenceTimer = setTimeout(stopRecordingAndSend, SILENCE_DELAY);
				};

				recognition.onend = () => { if (isRecording) { try { recognition.start(); } catch (e) { } } };
				recognition.onerror = (event) => {
					if (event.error === 'no-speech') return;
					clearTimeout(silenceTimer);
					isRecording = false;
					if (micBtn) { micBtn.textContent = 'Голос'; micBtn.classList.remove('recording'); }
				};
			}
		});
	</script>
</body>

</html>
