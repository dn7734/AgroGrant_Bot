<!DOCTYPE html>
<html lang="uk">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>AgroGrant Assistant</title>
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<style>
		body {
			font-family: 'Segoe UI', Tahoma, sans-serif;
			text-align: center;
			margin: 0;
			padding: 20px;
			background-color: #f4f7f6;
		}

		.container {
			max-width: 650px;
			margin: 0 auto;
		}

		#chatbox {
			width: 100%;
			height: 350px;
			background: white;
			border-radius: 10px;
			box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
			margin: 15px 0;
			overflow-y: auto;
			padding: 15px;
			text-align: left;
			display: flex;
			flex-direction: column;
			gap: 10px;
			box-sizing: border-box;
		}

		.msg {
			padding: 10px 15px;
			border-radius: 15px;
			max-width: 80%;
			word-wrap: break-word;
		}

		.user {
			background-color: #d1e7dd;
			align-self: flex-end;
			color: #0f5132;
		}

		.bot {
			background-color: #e2e3e5;
			align-self: flex-start;
			color: #41464c;
		}

		.controls {
			display: flex;
			gap: 8px;
			justify-content: center;
			margin-bottom: 12px;
		}

		#textInput {
			flex: 1;
			padding: 12px;
			border-radius: 25px;
			border: 1px solid #ccc;
			font-size: 15px;
			outline: none;
		}

		.btn {
			padding: 12px 22px;
			font-size: 16px;
			cursor: pointer;
			border-radius: 25px;
			color: white;
			border: none;
			transition: 0.2s;
			white-space: nowrap;
		}

		#sendBtn {
			background-color: #0d6efd;
		}

		#micBtn {
			background-color: #198754;
		}

		#downloadBtn {
			background-color: #6f42c1;
			margin-top: 10px;
			width: 100%;
		}

		#resetBtn {
			background-color: #6c757d;
			margin-top: 8px;
			width: 100%;
		}

		#micBtn.recording {
			background-color: #dc3545;
			animation: pulse 1.5s infinite;
		}

		@keyframes pulse {
			0% {
				transform: scale(1);
			}

			50% {
				transform: scale(1.04);
			}

			100% {
				transform: scale(1);
			}
		}

		#profileBox {
			background: white;
			padding: 12px 15px;
			border-radius: 10px;
			text-align: left;
			font-size: 14px;
			box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
			margin-top: 10px;
			line-height: 1.6;
		}

		#profileBox span {
			font-weight: 600;
			color: #198754;
		}

		#grantsBox {
			background: white;
			padding: 12px 15px;
			border-radius: 10px;
			text-align: left;
			font-size: 14px;
			box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
			margin-top: 10px;
			display: none;
		}

		.grant-item {
			border-bottom: 1px solid #eee;
			padding-bottom: 10px;
			margin-bottom: 10px;
		}

		.grant-score {
			font-weight: bold;
			color: #198754;
			font-size: 15px;
			float: right;
		}

		.grant-title {
			font-weight: 600;
			color: #333;
			margin-bottom: 4px;
			padding-right: 50px;
		}

		#chartContainer {
			width: 250px;
			height: 250px;
			margin: 15px auto 0 auto;
		}
	</style>
</head>

<body>
	<div class="container">
		<h1>🎙️ AgroGrant Assistant</h1>
		<p>Назвіть код ЄДРПОУ або розкажіть про агропідприємство</p>
		<div id="chatbox"></div>
		<div class="controls">
			<input type="text" id="textInput" placeholder="Текст або ЄДРПОУ..." />
			<button id="sendBtn" class="btn">Надіслати</button>
			<button id="micBtn" class="btn">Голос</button>
		</div>
		<div id="profileBox">
			<strong>Зібрані дані:</strong><br>
			ЄДРПОУ: <span id="p_edrpou">—</span> | Назва: <span id="p_company">—</span><br>
			КВЕД: <span id="p_kved">—</span> | Регіон: <span id="p_region">—</span><br>
			Внесок: <span id="p_own">—</span>
		</div>
		<div id="grantsBox">
			<strong>Сумісність із грантами:</strong>
			<div id="grantsList" style="margin-top: 10px;"></div>
			<div id="chartContainer"><canvas id="financeChart"></canvas></div>
		</div>
		<button id="downloadBtn" class="btn">Завантажити звіт (Word)</button>
		<button id="resetBtn" class="btn">Нова заявка (скинути)</button>
	</div>

	<script>
		document.addEventListener("DOMContentLoaded", () => {
			const BACKEND_URL = "https://" + "agrogrant.onrender.com";
			fetch(`${BACKEND_URL}/`).catch(() => { });
			function uuidv4() { return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16); }); }
			let userId = localStorage.getItem('agrogrant_user_id') || (localStorage.setItem('agrogrant_user_id', uuidv4()), localStorage.getItem('agrogrant_user_id'));

			const chatbox = document.getElementById('chatbox');
			const textInput = document.getElementById('textInput');
			let isRecording = false, isSending = false, silenceTimer = null;
			let finChart = null; // Змінна для графіка

			function addMessage(sender, text, isError = false) {
				const div = document.createElement('div');
				div.className = 'msg ' + (isError ? 'error' : (sender === 'Ви' ? 'user' : 'bot'));
				div.innerHTML = `<strong>${sender}:</strong><br>${text}`;
				chatbox.appendChild(div);
				chatbox.scrollTop = chatbox.scrollHeight;
			}

			function updateProfileUI(p) {
				const fields = ['edrpou', 'company_name', 'kved', 'region', 'own_contribution_percent'];
				fields.forEach(f => {
					const el = document.getElementById('p_' + (f === 'company_name' ? 'company' : f === 'own_contribution_percent' ? 'own' : f));
					if (el) el.textContent = p && p[f] ? p[f] : '—';
				});
			}

			function updateGrantsUI(grants, p) {
				const box = document.getElementById('grantsBox'), list = document.getElementById('grantsList');
				if (!grants || grants.length === 0) { box.style.display = 'none'; return; }
				box.style.display = 'block'; list.innerHTML = '';
				grants.forEach(g => {
					const div = document.createElement('div');
					div.className = 'grant-item';
					div.innerHTML = `<div class="grant-score">${g.score}%</div><div class="grant-title">${g.title}</div><div class="grant-details">Макс: ${g.max_amount} | ${g.reason}</div>`;
					list.appendChild(div);
				});

				// Малювання графіка для Топ-1 гранту
				const topGrant = grants[0];
				let ownPct = p && p.own_contribution_percent ? parseFloat(p.own_contribution_percent.replace(/[^\d.]/g, '')) : topGrant.min_own_percent;
				ownPct = Math.max(ownPct || 0, topGrant.min_own_percent);
				let grantPct = 100 - ownPct;

				if (finChart) finChart.destroy(); // Видаляємо старий графік
				finChart = new Chart(document.getElementById('financeChart'), {
					type: 'doughnut',
					data: {
						labels: ['Грант (%)', 'Власний внесок (%)'],
						datasets: [{ data: [grantPct, ownPct], backgroundColor: ['#0d6efd', '#198754'] }]
					},
					options: { plugins: { title: { display: true, text: 'Пропорція фінансування' } } }
				});
			}

			async function sendMessage(text) {
				if (!text.trim() || isSending) return;
				isSending = true; addMessage('Ви', text.trim()); textInput.value = '';
				try {
					const res = await fetch(`${BACKEND_URL}/chat/${userId}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: text.trim() }) });
					const data = await res.json();
					addMessage('AgroGrant', data.reply, data.is_error);
					updateProfileUI(data.profile); updateGrantsUI(data.grants, data.profile);
				} catch (e) { addMessage('Помилка', 'Не вдалося зв\'язатися з сервером', true); }
				finally { isSending = false; }
			}

			document.getElementById('sendBtn').onclick = () => sendMessage(textInput.value);
			textInput.onkeydown = e => { if (e.key === 'Enter') sendMessage(textInput.value); };

			const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
			if (SpeechRecognition) {
				const rec = new SpeechRecognition(); rec.lang = 'uk-UA'; rec.continuous = true; rec.interimResults = true;
				const micBtn = document.getElementById('micBtn');
				function stopRec() { clearTimeout(silenceTimer); isRecording = false; try { rec.stop(); } catch (e) { } micBtn.classList.remove('recording'); micBtn.textContent = 'Голос'; if (textInput.value) sendMessage(textInput.value); }
				micBtn.onclick = () => { if (isRecording) stopRec(); else { isRecording = true; rec.start(); micBtn.classList.add('recording'); micBtn.textContent = 'Готово'; } };
				rec.onresult = e => {
					clearTimeout(silenceTimer); let txt = '';
					for (let i = e.resultIndex; i < e.results.length; i++) txt += e.results[i][0].transcript;
					textInput.value = txt; silenceTimer = setTimeout(stopRec, 3500);
				};
				rec.onend = () => { if (isRecording) rec.start(); };
			}

			document.getElementById('downloadBtn').onclick = () => window.location.href = `${BACKEND_URL}/export/${userId}`;
			document.getElementById('resetBtn').onclick = () => { localStorage.removeItem('agrogrant_user_id'); location.reload(); };
		});
	</script>
</body>

</html>
